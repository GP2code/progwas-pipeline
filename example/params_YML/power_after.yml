# Power analysis AFTER a run has completed 
#
# Increased accuracy by using post-QC data and covariates
# Post-QC data found in <analyses_dir>/<genetic_cache_key>/<analysis_name>/prepared_data/*_filtered.pca.harmonized.tsv
#
# Example use:
# nextflow run run_power_analysis.nf -profile standard -params-file example/params_YML/power_after.yml

# ==================== INPUT FILES ====================
# Phenotype file (same as the one used in the run)
phenofile: "${projectDir}/example/phenotype.cs.tsv"

# Post-QC files written by a run (using genetic_cache_key and analysis_name from the run)
power_analysis_set: "${launchDir}/analyses/<genetic_cache_key>/<analysis_name>/prepared_data/*_filtered.pca.harmonized.tsv"

# ==================== VARIABLE NAMES ====================
pheno_name: "y" # surv_y when CoxPH, or y when GLM/LMM
covar_numeric: "SEX age_at_baseline PC1 PC2 PC3"
covar_categorical: "site specimen"
study_arm_col: "study_arm"

# ==================== ANALYSIS TYPE ====================
linear_flag: true
longitudinal_flag: false
survival_flag: false
# time_col: "study_days"        # required when longitudinal_flag is true

# ==================== STUDY QC THRESHOLDS ====================
# Use the same values the run used, so Passes_QC reflects the real filters.
minor_allele_freq: "0.05"
minor_allele_ct: "20"

# ==================== POWER OPTIONS ====================
power_alpha: 5e-8
power_target: 0.80
power_maf_grid: "0.01 0.05 0.10 0.20 0.50"

# Imputation r2 stays an assumption even here: proGWAS strips the INFO column
# from its pgen output (process1.sh, 'pvar-cols='), so the server's R2 cannot be
# recovered from a completed run. State the value you assumed in the methods.
power_info: 0.7

power_rank_int: false       # true if the phenotype was rank-INT transformed
power_residualize: true     # residual SD after the covariates above
power_per_arm: true         # one row per study arm plus a pooled ALL row
power_prefix: "POWER_AFTER"
# Results land in <power_outdir>/glm/<power_prefix>/
power_outdir: "${launchDir}/power_analysis"

# ==================== BEFORE a run, instead of the above ====================
# Comment out power_analysis_set and phenofile, and uncomment these. Setting
# power_n_grid together with power_analysis_set is an error, not a precedence.
#
# power_n_grid: "1000 2500 5000"   # hypothetical sample sizes
# power_sd_pheno: 5.7              # assumed SD, from literature or a pilot;
#                                  # without it MDE_beta_raw cannot be computed
