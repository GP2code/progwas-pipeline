# Power analysis for a longitudinal GWAS (GALLOP / linear mixed model).
#
# Repeat visits on one subject are correlated, so k visits are worth less than k
# independent observations. N_info = N*k/(1+(k-1)*rho), with the ICC (rho) and k
# estimated from the repeated rows in the phenotype file.
#
# nextflow run run_power_analysis.nf -profile standard -params-file example/params_YML/power_lt.yml

# ==================== INPUT FILES ====================
phenofile: "${projectDir}/example/phenotype.lt.tsv"
covarfile: "${projectDir}/example/covariates.tsv"

# ==================== VARIABLE NAMES ====================
pheno_name: "y"
time_col: "study_days"          # required: identifies the repeated measurements
covar_numeric: "SEX age_at_baseline"
covar_categorical: "site specimen"
study_arm_col: "study_arm"

# ==================== ANALYSIS TYPE ====================
linear_flag: false
longitudinal_flag: true
survival_flag: false

# ==================== STUDY QC THRESHOLDS ====================
minor_allele_freq: "0.05"
minor_allele_ct: "20"

# ==================== POWER OPTIONS ====================
power_alpha: 5e-8
power_target: 0.80
power_maf_grid: "0.01 0.05 0.10 0.20 0.50"
power_info: 1.0
# power_icc: 0.45              # override the ICC estimated from the data
power_slope_term: true         # also report the SNPxtime (slope) term as an upper bound
power_prefix: "POWER_LT"
# Results land in <power_outdir>/lmm_gallop/<power_prefix>/
power_outdir: "${launchDir}/power_analysis"
