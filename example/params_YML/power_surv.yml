# Power analysis for a time-to-event GWAS (Cox proportional hazards).
#
# Survival power is driven by the number of observed EVENTS, not the number of
# people enrolled: N_info = D. Censored subjects contribute follow-up but no event.
# Effects are reported as hazard ratios rather than SD units.
#
# NOTE: the bundled phenotype.surv.tsv is fully uncensored (every subject has an
# event), so D == N here. On real data D is well below N and the gap matters.
#
# nextflow run run_power_analysis.nf -profile standard -params-file example/params_YML/power_surv.yml

# ==================== INPUT FILES ====================
phenofile: "${projectDir}/example/phenotype.surv.tsv"
covarfile: "${projectDir}/example/covariates.tsv"

# ==================== VARIABLE NAMES ====================
pheno_name: "surv_y"            # must be a 0/1 event indicator
covar_numeric: "SEX age_at_baseline"
covar_categorical: "site specimen"
study_arm_col: "study_arm"
# power_event_col: "surv_y"     # set if the event indicator is not pheno_name

# ==================== ANALYSIS TYPE ====================
linear_flag: false
longitudinal_flag: false
survival_flag: true

# ==================== STUDY QC THRESHOLDS ====================
minor_allele_freq: "0.05"
minor_allele_ct: "20"

# ==================== POWER OPTIONS ====================
power_alpha: 5e-8
power_target: 0.80
power_maf_grid: "0.01 0.05 0.10 0.20 0.50"
power_info: 1.0
power_prefix: "POWER_SURV"
# Results land in <power_outdir>/cph/<power_prefix>/
power_outdir: "${launchDir}/power_analysis"
